name: Deploy

# Orchard's own push-to-deploy reports itself enabled and deliverable but
# never builds on a push, and its deploy-webhook token only restarts the
# running image (both checked 2026-10-19). So GitHub asks Orchard's API for
# a rebuild, with an Orchard API token in ORCHARD_API_TOKEN — until that
# secret exists this does nothing. Only after CI passed on main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.repository == 'Devansh-awat/kyto'
    runs-on: ubuntu-latest
    steps:
      - name: Ask Orchard to rebuild kyto from main
        env:
          ORCHARD_API_TOKEN: ${{ secrets.ORCHARD_API_TOKEN }}
        run: |
          if [ -z "$ORCHARD_API_TOKEN" ]; then
            echo "ORCHARD_API_TOKEN is not set; skipping the deploy."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $ORCHARD_API_TOKEN" \
            https://orchard.devansh.dino.icu/apiv1/deployments/bba0a135-84b4-4531-92af-0e5ec69107f2/rebuild
